name: Flask CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/vec1or/demo-app:latest
            ghcr.io/vec1or/demo-app:${{ github.sha }}

  deploy:
    name: Deploy to K3s
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, cd-k3s]

    timeout-minutes: 10

    steps:
      - name: Deploy image
        env:
          KUBECONFIG: /home/github-runner/.kube/config
          IMAGE: ghcr.io/vec1or/demo-app:${{ github.sha }}
        run: |
          kubectl -n devops-helm set image \
            deployment/demo-app-flask \
            flask="$IMAGE"

          kubectl -n devops-helm rollout status \
            deployment/demo-app-flask --timeout=180s

      - name: Verify deployment
        env:
          KUBECONFIG: /home/github-runner/.kube/config
        run: |
          kubectl -n devops-helm get deployment demo-app-flask